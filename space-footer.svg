
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">
  <defs>
    <linearGradient id="footerSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101329"/>
      <stop offset="40%" stop-color="#292044"/>
      <stop offset="75%" stop-color="#8a597e"/>
      <stop offset="100%" stop-color="#e5a18e"/>
    </linearGradient>

    <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#292044"/>
      <stop offset="50%" stop-color="#654363"/>
      <stop offset="100%" stop-color="#d98d9d"/>
    </linearGradient>
  </defs>

  <!-- Cosmic sunrise sky -->
  <rect width="1200" height="180" fill="url(#footerSky)"/>

  <!-- Tiny stars -->
  <g fill="#fff0e7">
    <circle cx="110" cy="35" r="1.4">
      <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="275" cy="62" r="1"/>
    <circle cx="420" cy="25" r="1.3">
      <animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="40" r="1.2"/>
    <circle cx="895" cy="25" r="1.5">
      <animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="58" r="1.2"/>
  </g>
  
  <!-- The best part is here :) -->
  <!-- Back wave -->
  <path fill="#5c416e" opacity=".65">
    <animate attributeName="d"
      dur="11s" repeatCount="indefinite"
      values="
      M0,85 C180,130 300,30 480,75 S820,130 1000,70 S1150,45 1200,75 L1200,180 L0,180 Z;
      M0,65 C180,25 300,115 480,70 S820,25 1000,85 S1150,110 1200,65 L1200,180 L0,180 Z;
      M0,85 C180,130 300,30 480,75 S820,130 1000,70 S1150,45 1200,75 L1200,180 L0,180 Z"/>
  </path>

  <!-- Middle wave -->
  <path fill="#443153" opacity=".9">
    <animate attributeName="d"
      dur="9s" repeatCount="indefinite"
      values="
      M0,105 C160,55 320,135 500,95 S820,55 1000,105 S1130,125 1200,90 L1200,180 L0,180 Z;
      M0,90 C160,135 320,55 500,105 S820,135 1000,85 S1130,55 1200,105 L1200,180 L0,180 Z;
      M0,105 C160,55 320,135 500,95 S820,55 1000,105 S1130,125 1200,90 L1200,180 L0,180 Z"/>
  </path>

  <!-- Front wave -->
  <path fill="url(#waveFront)">
    <animate attributeName="d"
      dur="8s" repeatCount="indefinite"
      values="
      M0,125 C180,90 300,155 480,120 S800,90 980,130 S1130,145 1200,120 L1200,180 L0,180 Z;
      M0,110 C180,150 300,100 480,135 S800,150 980,110 S1130,100 1200,135 L1200,180 L0,180 Z;
      M0,125 C180,90 300,155 480,120 S800,90 980,130 S1130,145 1200,120 L1200,180 L0,180 Z"/>
  </path>
</svg>
