
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <!-- Cosmic sunrise background -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101329"/>
      <stop offset="40%" stop-color="#292044"/>
      <stop offset="72%" stop-color="#654363"/>
      <stop offset="100%" stop-color="#e5a18e"/>
    </linearGradient>

    <radialGradient id="sunrise">
      <stop offset="0%" stop-color="#ffcfaa" stop-opacity=".45"/>
      <stop offset="45%" stop-color="#e99ac1" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#b78cff" stop-opacity="0"/>
    </radialGradient>

    <!-- Planet surface -->
    <radialGradient id="planetBase" cx="28%" cy="24%" r="82%">
      <stop offset="0%" stop-color="#f3c6d8"/>
      <stop offset="30%" stop-color="#bba0e8"/>
      <stop offset="65%" stop-color="#655caa"/>
      <stop offset="100%" stop-color="#28294e"/>
    </radialGradient>

    <linearGradient id="planetShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111329" stop-opacity=".05"/>
      <stop offset="65%" stop-color="#111329" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#090b1b" stop-opacity=".8"/>
    </linearGradient>

    <linearGradient id="meteorTrail">
      <stop offset="0%" stop-color="#fff0d9" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff0d9" stop-opacity=".95"/>
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="planetClip">
      <circle cx="1000" cy="137" r="72"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#sky)"/>
  <ellipse cx="900" cy="205" rx="470" ry="180" fill="url(#sunrise)"/>
  <ellipse cx="210" cy="65" rx="330" ry="170" fill="#8974dd" opacity=".09"/>

  <!-- Stars: different sizes and subtle twinkles -->
  <g fill="#fff0e7">
    <circle cx="43" cy="42" r="1.3">
      <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="112" r="1"/>
    <circle cx="175" cy="32" r="1.5">
      <animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="228" cy="222" r="1.2"/>
    <circle cx="285" cy="75" r="1">
      <animate attributeName="opacity" values=".2;1;.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="185" r="1.5"/>
    <circle cx="388" cy="35" r="1.2">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="245" r="1"/>
    <circle cx="475" cy="68" r="1.3"/>
    <circle cx="520" cy="220" r="1.1">
      <animate attributeName="opacity" values="1;.3;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="590" cy="30" r="1.5"/>
    <circle cx="635" cy="240" r="1.2">
      <animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="58" r="1"/>
    <circle cx="755" cy="200" r="1.4"/>
    <circle cx="810" cy="35" r="1.2">
      <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="240" r="1"/>
    <circle cx="920" cy="38" r="1.4"/>
    <circle cx="1110" cy="35" r="1.2">
      <animate attributeName="opacity" values="1;.25;1" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1155" cy="100" r="1.4"/>
    <circle cx="1130" cy="240" r="1.1"/>
    <circle cx="1065" cy="225" r="1.4">
      <animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- A few brighter four-point stars -->
  <g stroke="#fff0df" stroke-width="1" opacity=".8">
    <path d="M250 48 V58 M245 53 H255"/>
    <path d="M720 105 V117 M714 111 H726"/>
    <path d="M1140 160 V170 M1135 165 H1145"/>
  </g>

  <!-- Shooting star 1 -->
  <g>
    <path d="M0 0 L-65 0" stroke="url(#meteorTrail)" stroke-width="1.5"/>
    <circle r="1.6" fill="#fff6e9"/>
    <animateMotion path="M 560,-15 L 425,120"
      dur="7s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="0;0;1;0;0" dur="7s" begin="1s" repeatCount="indefinite"/>
  </g>

  <!-- Shooting star 2 -->
  <g>
    <path d="M0 0 L-55 0" stroke="url(#meteorTrail)" stroke-width="1.4"/>
    <circle r="1.5" fill="#fff6e9"/>
    <animateMotion path="M 1190,20 L 1090,120"
      dur="9s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="0;0;.9;0;0" dur="9s" begin="3s" repeatCount="indefinite"/>
  </g>

  <!-- Shooting star 3 -->
  <g>
    <path d="M0 0 L-48 0" stroke="url(#meteorTrail)" stroke-width="1.3"/>
    <circle r="1.4" fill="#fff6e9"/>
    <animateMotion path="M 260,125 L 190,195"
      dur="10s" begin="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="0;0;.8;0;0" dur="10s" begin="6s" repeatCount="indefinite"/>
  </g>

  <!-- Planet's soft atmospheric glow -->
  <circle cx="1000" cy="137" r="81"
    fill="#d7a7f5" opacity=".13" filter="url(#glow)"/>

  <!-- Planet body -->
  <circle cx="1000" cy="137" r="72" fill="url(#planetBase)"/>

  <!-- Horizontally rotating surface -->
  <g clip-path="url(#planetClip)">
    <g>
      <!-- Cloud bands -->
      <path d="M900 88 Q950 68 995 87 T1100 80"
        fill="none" stroke="#ffe0df" stroke-width="12" opacity=".28"/>
      <path d="M900 117 Q950 100 1000 121 T1100 111"
        fill="none" stroke="#f6c0d8" stroke-width="15" opacity=".3"/>
      <path d="M900 151 Q950 133 1000 155 T1100 148"
        fill="none" stroke="#b7a9f5" stroke-width="13" opacity=".32"/>
      <path d="M900 184 Q950 165 1000 186 T1100 179"
        fill="none" stroke="#f4c3ce" stroke-width="10" opacity=".22"/>

      <!-- Longitude bands change width to simulate horizontal spin -->
      <g fill="none" stroke="#f4d8ed" stroke-width="1.2" opacity=".3">
        <ellipse cx="1000" cy="137" rx="16" ry="72"/>
        <ellipse cx="1000" cy="137" rx="36" ry="72"/>
        <ellipse cx="1000" cy="137" rx="58" ry="72"/>

        <animateTransform attributeName="transform"
          type="translate" values="-130 0;130 0;-130 0"
          dur="24s" repeatCount="indefinite"/>
      </g>

      <!-- Soft shading stays fixed while surface moves -->
      <rect x="925" y="60" width="150" height="155"
        fill="url(#planetShade)"/>

      <animateTransform attributeName="transform"
        type="translate" values="-12 0;12 0;-12 0"
        dur="24s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Atmospheric outline -->
  <circle cx="1000" cy="137" r="72"
    fill="none" stroke="#f2c8ef" stroke-width="1.3" opacity=".75"/>

  <!-- Name -->
  <text x="540" y="112" text-anchor="middle"
    font-family="Georgia, serif" font-size="46"
    font-style="italic" fill="#fff0f1" filter="url(#glow)">
    Arshya Baweja
    <animate attributeName="opacity"
      values=".88;1;.88" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Tagline -->
  <text x="540" y="153" text-anchor="middle"
    font-family="monospace" font-size="12"
    letter-spacing="2.2" fill="#f1d9ed">
    COMPUTER SCIENCE · DEVELOPER · CREATOR
  </text>

  <text x="540" y="181" text-anchor="middle"
    font-family="monospace" font-size="11"
    letter-spacing=".5" fill="#f5cfcf">
    Building ideas into reality, one line of code at a time.
  </text>

  <text x="78" y="322" font-size="11" letter-spacing="3"
      fill="#828cb6">CURIOSITY  /  CODE  /  COSMOS 
  </text>
  
  <line x1="485" y1="207" x2="595" y2="207"
    stroke="#f2b7d5" stroke-width="1" opacity=".8"/>
</svg>
